spring.application.name=movie-recommender
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/cinematch
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Token signing key (HS256 needs >= 32 characters). Override in production with APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-cinematch-secret-key-0123456789}
app.jwt.ttl-hours=12
